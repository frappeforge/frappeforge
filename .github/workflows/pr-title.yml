name: PR title

# Pull requests are squash-merged and the title becomes the commit on main, so the title is what must
# follow Conventional Commits. Local commit messages are discarded by the squash and are not checked.
on:
    pull_request:
        types: [opened, edited, synchronize, reopened]
    # Required checks must also report in the merge queue. The job passes trivially there — the pull
    # request was already checked — because the check step is guarded on pull_request.
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    pull-requests: read

jobs:
    pr-title:
        name: pr-title
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Check the title follows Conventional Commits
              if: github.event_name == 'pull_request'
              uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      perf
                      refactor
                      docs
                      test
                      build
                      ci
                      chore
                      revert
                  scopes: |
                      client
                      codegen
                      realtime
                      react
                      deps
                      ci
                      docs
                      repo
                      release
                  requireScope: true
                  # Lower-case start, like `feat(client): add …`.
                  subjectPattern: ^(?![A-Z]).+$
                  subjectPatternError: 'The subject "{subject}" must start with a lower-case letter.'
