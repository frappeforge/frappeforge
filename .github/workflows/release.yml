name: Release

on:
    push:
        branches: [main]

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

env:
    HUSKY: '0'

jobs:
    release:
        name: release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write # version PR commit and GitHub releases
            pull-requests: write # open / update the "Version Packages" PR
            id-token: write # npm provenance (OIDC)
        steps:
            # Events created with the default GITHUB_TOKEN never start workflows, so a
            # "Version Packages" PR opened with it would have no CI checks and could never
            # satisfy the main ruleset. A GitHub App token (installed on this repo) does.
            - name: Create release app token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  # Scope the token to exactly what changesets/action needs, regardless of
                  # what the app installation was granted.
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # changesets/action pushes the version branch with this token, so it must
                  # be the app token and must persist for the push.
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: true

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Gate
              run: pnpm gate

            - name: Create version PR or publish
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: pnpm version-packages
                  publish-script: pnpm release
                  commit-message: 'chore(release): version packages'
                  pr-title: 'chore(release): version packages'
                  create-github-releases: true
                  github-token: ${{ steps.app-token.outputs.token }}
              env:
                  # Phase 1: granular publish token. Phase 2 (after npm trusted publishing is
                  # enabled for both packages): delete the secret and the line below; the
                  # id-token permission above is then sufficient.
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
