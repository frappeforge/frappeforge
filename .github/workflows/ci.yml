name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    HUSKY: '0'

jobs:
    # Everything that does not depend on the Node version or the OS runs once.
    checks:
        name: checks
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm format:check

            - name: Find unused files, exports and dependencies (knip)
              run: pnpm knip

            - name: Check public API surface
              run: pnpm api:check

            - name: Check package.json and exports (publint)
              run: pnpm publint

    # Only what the runtime and OS affect runs across the matrix.
    test:
        name: test (${{ matrix.os }}, node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                node: ['22.12.0', 24, 26]
                include:
                    # The consumer floor is below the development floor: build on 24, then test on the floor.
                    - node: '22.12.0'
                      build-node: 24
                    - os: windows-latest
                      node: 24
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.build-node || matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Switch to the consumer floor
              if: matrix.build-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}

            - name: Test
              run: pnpm test

            - name: Verify packed consumers
              run: pnpm verify:packed

    # One job, so a new advisory reports once instead of failing every matrix job.
    audit:
        name: audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit dependencies
              run: pnpm audit --audit-level high

    workflows:
        name: workflows (zizmor)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            security-events: write # upload SARIF to the Security tab
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Lint GitHub Actions workflows
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  min-severity: low
                  advanced-security: true
