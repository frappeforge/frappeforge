# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Every action is pinned to a full commit SHA with its version in a trailing comment
# (`owner/repo@<sha> # vX.Y.Z`). Tags are mutable and can be rewritten by whoever controls the
# action's repository; a SHA cannot. Dependabot updates the SHA and the comment together.
rules:
    unpinned-uses:
        config:
            policies:
                '*': hash-pin
