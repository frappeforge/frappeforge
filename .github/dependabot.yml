version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      # Longer than pnpm's 24 h minimumReleaseAge, so every proposed version is installable.
      cooldown:
          default-days: 3
      labels: [deps]
      commit-message:
          prefix: 'chore(deps)'
      ignore:
          # @types/node must track the MINIMUM supported Node (engines.node), not the newest.
          # Bump it by hand together with engines.node when the baseline moves.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # TypeScript stays on 6.x until typescript-eslint supports 7.x (it refuses to run
          # against TS 7.0 today). Bump by hand once that lands.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
      groups:
          eslint:
              patterns: ['eslint*', '@eslint/*', 'typescript-eslint', '@vitest/eslint-plugin', 'globals']
          typescript:
              patterns: ['typescript']
          vitest:
              patterns: ['vitest', '@vitest/*']
          build:
              patterns: ['tsdown', 'rolldown*', 'publint', '@arethetypeswrong/*', '@microsoft/api-extractor']
          changesets:
              patterns: ['@changesets/*']
          git-hooks:
              patterns: ['husky', 'lint-staged']
          hygiene:
              patterns: ['knip']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      cooldown:
          default-days: 3
      labels: [ci]
      commit-message:
          prefix: 'chore(ci)'
      groups:
          github-actions:
              patterns: ['*']
